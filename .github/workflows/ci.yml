name: ci

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. A stacked PR — one whose base is
  # another feature branch rather than main — matched nothing under
  # `branches: [main]`, so it reported no checks at all until the branch below
  # it merged. Unverified is worse than late. `push` stays on main so a branch
  # push does not duplicate the pull_request run.
  pull_request:
    branches: ["**"]
  # main went three weeks without a verified run once, because ci.yml only
  # fires on a push to it and a quiet period looks identical to a green one.
  # A weekly run means an external break — a new Go release, a new advisory —
  # surfaces on its own rather than on the next contributor's PR.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify formatting
        run: test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Coverage gate (>=98%, excluding demo examples)
        run: |
          go test -coverprofile=coverage.out ./...
          grep -v '/examples/' coverage.out > coverage.filtered.out
          pct=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage (excluding examples): ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 98 ? 0 : 1) }' || { echo "coverage ${pct}% is below 98%"; exit 1; }
      - name: Build
        run: go build ./...

  test-matrix:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Install PDF tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install PDF tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned deliberately, and pinned TOGETHER with the linter below.
          #
          # golangci-lint embeds go/types from the toolchain it was built
          # with, so a pinned linter against a floating `stable` breaks on
          # every Go release: v2.12.2 met Go 1.27 and panicked inside
          # go/types, turning the job red for a reason unrelated to this
          # code. `golangci-lint run` was clean locally throughout, which is
          # the worst kind of red — it trains everyone to ignore the check.
          #
          # Bump these two as a pair, never one alone. The linter always lags
          # a new Go release, so this version trails `stable` by design; the
          # build, test and vuln jobs above still run on `stable`.
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # Skip the remote JSON-schema fetch (flaky CDN); config is verified locally.
          verify: false

  # The install contract is a promise to packagers, so it is checked the way a
  # packager would use it: a staged tree on a clean runner, compared against
  # the exact file list docs/packaging.md tells them to expect.
  install:
    name: install contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Stage an install
        run: make -f GNUmakefile install DESTDIR=/tmp/stage PREFIX=/usr
      - name: Verify the staged tree
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'MANIFEST'
          ./usr/bin/draft
          ./usr/share/bash-completion/completions/draft
          ./usr/share/doc/draft/CHANGELOG.md
          ./usr/share/doc/draft/README.md
          ./usr/share/fish/vendor_completions.d/draft.fish
          ./usr/share/licenses/draft/LICENSE-APACHE
          ./usr/share/licenses/draft/LICENSE-MIT
          ./usr/share/man/man1/draft.1
          ./usr/share/zsh/site-functions/_draft
          MANIFEST
          sed -i 's/^          //' /tmp/expected.txt
          (cd /tmp/stage && find . -type f | sort) > /tmp/found.txt
          diff /tmp/expected.txt /tmp/found.txt
          test -x /tmp/stage/usr/bin/draft
      - name: The manpage must render without warnings
        run: |
          sudo apt-get update && sudo apt-get install -y groff
          groff -man -Tutf8 -ww /tmp/stage/usr/share/man/man1/draft.1 >/dev/null 2>err.txt
          if [ -s err.txt ]; then cat err.txt; exit 1; fi
      - name: Uninstall must leave nothing behind
        run: |
          make -f GNUmakefile uninstall DESTDIR=/tmp/stage PREFIX=/usr
          test -z "$(find /tmp/stage -type f)"

  msrv:
    name: msrv (go 1.24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true
      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build and test on the declared minimum
        run: |
          go build ./...
          go test ./...

  # Report how the public API moved since the last release. It does not fail:
  # while the module is 0.0.x the stability policy permits breaking changes,
  # so the job's value is making them visible and un-missable in review, not
  # blocking them. When the module reaches 1.x, make this a hard gate.
  api:
    name: api surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Compare against the last release
        run: |
          set -uo pipefail
          go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260824195058-e88cd73687aa
          base=$(git tag --sort=-v:refname | head -1)
          if [ -z "$base" ]; then echo "no tags yet"; exit 0; fi
          {
            echo "## Public API vs \`$base\`"
            echo
            echo '```'
            "$(go env GOPATH)/bin/gorelease" -base "$base" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$(go env GOPATH)/bin/gorelease" -base "$base" 2>&1 | tail -40 || true

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      # go.sum records a hash per module version; this proves the cache we are
      # about to build from still matches them.
      - name: Verify module hashes
        run: go mod verify

      # Pinned, not @latest. This freezes the scanner, not the advisories:
      # govulncheck fetches the vulnerability database at run time, so a new
      # CVE is still caught the day it lands.
      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
