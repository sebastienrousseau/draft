# SPDX-License-Identifier: MIT OR Apache-2.0
version: 2

project_name: draft

before:
  hooks:
    - go mod tidy
    # Generate the manpage and completions from the CLI definitions, so the
    # packaged documentation cannot describe a different program than the
    # binary beside it. `go run` builds the current tree, so these always
    # match the archive they ship in.
    # Generated into .gen/, not dist/: `before` hooks run before goreleaser
    # clears the distribution directory, so writing there makes it refuse to
    # start with "dist is not empty". Not build/ either — that is tracked, and
    # holds the release signing certificates.
    - mkdir -p .gen
    - sh -c 'go run ./cmd/draft --man > .gen/draft.1'
    - sh -c 'go run ./cmd/draft --completion bash > .gen/draft.bash'
    - sh -c 'go run ./cmd/draft --completion zsh > .gen/_draft'
    - sh -c 'go run ./cmd/draft --completion fish > .gen/draft.fish'

builds:
  - id: draft
    main: ./cmd/draft
    binary: draft
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Sign and notarize the macOS executables before they are archived. GoReleaser
# uses quill here, so the release can remain on a Linux runner.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - draft
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # An archive that is only a binary makes every packager reconstruct the
    # manpage, the completions and the licence texts themselves.
    files:
      - src: .gen/draft.1
        dst: share/man/man1/draft.1
      - src: .gen/draft.bash
        dst: share/bash-completion/completions/draft
      - src: .gen/_draft
        dst: share/zsh/site-functions/_draft
      - src: .gen/draft.fish
        dst: share/fish/vendor_completions.d/draft.fish
      - LICENSE-MIT
      - LICENSE-APACHE
      - README.md
      - CHANGELOG.md

# Native packages, built from the same binaries the archives carry rather than
# from a separate build, so a .deb and a .tar.gz of one version cannot differ.
nfpms:
  - id: draft
    package_name: draft
    vendor: Sebastien Rousseau
    homepage: https://draftlib.com
    maintainer: Sebastien Rousseau <sebastian.rousseau@gmail.com>
    description: |-
      Turn research papers into grounded Markdown drafts.
      Claims are admitted only when their supporting quote occurs verbatim in
      the source, so the model that writes the article never sees an
      unverified fact.
    license: MIT OR Apache-2.0
    formats: [deb, rpm, apk]
    # draft reports a missing tool with an actionable message rather than
    # failing at load, and Markdown sources need nothing at all, so Poppler is
    # recommended rather than required.
    recommends:
      - poppler-utils
    section: utils
    contents:
      - src: .gen/draft.1
        dst: /usr/share/man/man1/draft.1
        file_info: { mode: 0644 }
      - src: .gen/draft.bash
        dst: /usr/share/bash-completion/completions/draft
        file_info: { mode: 0644 }
      - src: .gen/_draft
        dst: /usr/share/zsh/site-functions/_draft
        file_info: { mode: 0644 }
      - src: .gen/draft.fish
        dst: /usr/share/fish/vendor_completions.d/draft.fish
        file_info: { mode: 0644 }
      - src: README.md
        dst: /usr/share/doc/draft/README.md
        file_info: { mode: 0644 }
      - src: CHANGELOG.md
        dst: /usr/share/doc/draft/CHANGELOG.md
        file_info: { mode: 0644 }
      - src: LICENSE-MIT
        dst: /usr/share/licenses/draft/LICENSE-MIT
        file_info: { mode: 0644 }
      - src: LICENSE-APACHE
        dst: /usr/share/licenses/draft/LICENSE-APACHE
        file_info: { mode: 0644 }

checksum:
  name_template: "checksums.txt"

# A CycloneDX SBOM per archive, so consumers can audit exactly what shipped.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Keyless Sigstore signature over the checksum file: verifying it transitively
# covers every artefact listed there.
signs:
  - id: checksums
    cmd: cosign
    # cosign v3 emits a Sigstore bundle carrying both the signature and the
    # signing certificate; verify with:
    #   cosign verify-blob --bundle checksums.txt.sigstore.json \
    #     --certificate-identity-regexp 'https://github.com/sebastienrousseau/draft/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  disable: true

release:
  # Re-running a tag replaces the release's assets rather than failing because
  # it already exists. That makes recovery from a mid-run failure a re-run
  # instead of a manual delete — at the cost that an accidental re-run can
  # overwrite artifacts people may already hold, so treat a re-run of a
  # published tag as deliberate.
  mode: replace
  github:
    owner: sebastienrousseau
    name: draft
