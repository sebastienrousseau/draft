name: release

on:
  push:
    tags: ["v*"]
  # A dry run builds, archives and signs nothing, so new release machinery can
  # be exercised before a tag makes its failure permanent.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and archive without publishing"
        type: boolean
        default: true

# Read-only by default; the release job widens only what it needs.
permissions: read-all

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # publish the release and its assets
      id-token: write      # keyless cosign signing via OIDC
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=publish,sign,notarize,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Verify the archives carry their documentation
        run: |
          set -euo pipefail
          archive=$(ls dist/draft_*_linux_amd64.tar.gz | head -1)
          # List once into a file rather than piping per entry. `grep -q` exits
          # on its first match, which closes the pipe; GNU tar then fails with
          # "stdout: write error" and pipefail turns a found file into a
          # missing one. bsdtar tolerates it, so this only ever failed on the
          # Linux runner.
          tar tzf "$archive" > /tmp/archive-contents.txt
          missing=0
          for f in share/man/man1/draft.1 \
                   share/bash-completion/completions/draft \
                   share/zsh/site-functions/_draft \
                   share/fish/vendor_completions.d/draft.fish \
                   LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md draft; do
            if ! grep -qx "$f" /tmp/archive-contents.txt; then
              echo "missing from archive: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- archive contains ---"
            cat /tmp/archive-contents.txt
            exit 1
          fi
          echo "archive carries its documentation"

      - name: Attest build provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  package:
    needs: goreleaser
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Import Apple signing identities
        env:
          APPLICATION_P12: ${{ secrets.MACOS_CERTIFICATE }}
          APPLICATION_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/draft-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLICATION_P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$NOTARY_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/application.p12" -P "$APPLICATION_PASSWORD" -A -f pkcs12 -k "$keychain"
          security import "$RUNNER_TEMP/installer.p12" -P "$INSTALLER_PASSWORD" -A -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize universal installer
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          assets="$RUNNER_TEMP/assets"
          root="$RUNNER_TEMP/pkgroot"
          mkdir -p "$assets/amd64" "$assets/arm64" "$root/usr/local/bin"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "draft_${version}_darwin_amd64.tar.gz" \
            --pattern "draft_${version}_darwin_arm64.tar.gz" \
            --dir "$assets"
          tar -xzf "$assets/draft_${version}_darwin_amd64.tar.gz" -C "$assets/amd64"
          tar -xzf "$assets/draft_${version}_darwin_arm64.tar.gz" -C "$assets/arm64"
          lipo -create "$assets/amd64/draft" "$assets/arm64/draft" \
            -output "$root/usr/local/bin/draft"
          chmod 0755 "$root/usr/local/bin/draft"
          codesign --force --options runtime --timestamp \
            --sign "$APPLICATION_IDENTITY" "$root/usr/local/bin/draft"
          codesign --verify --deep --strict --verbose=2 "$root/usr/local/bin/draft"
          lipo "$root/usr/local/bin/draft" -verify_arch x86_64 arm64
          pkg="$RUNNER_TEMP/draft_${version}_universal.pkg"
          pkgbuild --root "$root" \
            --identifier com.draftlib.draft \
            --version "$version" \
            --install-location / \
            --ownership recommended \
            --sign "$INSTALLER_IDENTITY" \
            "$pkg"
          xcrun notarytool submit "$pkg" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 20m
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          pkgutil --check-signature "$pkg"
          echo "PKG_PATH=$pkg" >> "$GITHUB_ENV"
      - name: Publish package and refresh signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          manifest="$RUNNER_TEMP/checksums.txt"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --dir "$RUNNER_TEMP"
          shasum -a 256 "$PKG_PATH" | \
            awk -v name="$(basename "$PKG_PATH")" '{print $1 "  " name}' >> "$manifest"
          LC_ALL=C sort -u -k2,2 "$manifest" -o "$manifest"
          cosign sign-blob --bundle "$manifest.sigstore.json" "$manifest" --yes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "$PKG_PATH" "$manifest" "$manifest.sigstore.json" --clobber
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PKG_PATH }}
      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RELEASE_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/notary.p8"

  verify-release:
    needs: [goreleaser, package]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify every published artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          assets="$RUNNER_TEMP/release"
          mkdir -p "$assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          cd "$assets"
          shasum -a 256 -c checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          for arch in amd64 arm64; do
            mkdir "$arch"
            tar -xzf "draft_${version}_darwin_${arch}.tar.gz" -C "$arch"
            codesign --verify --deep --strict --verbose=2 "$arch/draft"
            codesign -dvv "$arch/draft" 2>&1 | \
              grep -F "Authority=Developer ID Application: Sebastien Rousseau (X46A93VJAG)"
            "$arch/draft" --version | grep -F "draft $version"
          done
          pkg="draft_${version}_universal.pkg"
          pkgutil --check-signature "$pkg" | \
            grep -F "Developer ID Installer: Sebastien Rousseau (X46A93VJAG)"
          xcrun stapler validate "$pkg"
          for artifact in draft_*.tar.gz draft_*.zip "$pkg"; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
