version: 2

project_name: draft

before:
  hooks:
    - go mod tidy

builds:
  - id: draft
    main: ./cmd/draft
    binary: draft
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# A CycloneDX SBOM per archive, so consumers can audit exactly what shipped.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Keyless Sigstore signature over the checksum file: verifying it transitively
# covers every artefact listed there.
signs:
  - id: checksums
    cmd: cosign
    # cosign v3 emits a Sigstore bundle carrying both the signature and the
    # signing certificate; verify with:
    #   cosign verify-blob --bundle checksums.txt.sigstore.json \
    #     --certificate-identity-regexp 'https://github.com/sebastienrousseau/draft/.*' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  disable: true

release:
  github:
    owner: sebastienrousseau
    name: draft
