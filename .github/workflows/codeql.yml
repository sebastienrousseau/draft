name: codeql

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. A stacked PR — one whose base is
  # another feature branch rather than main — matched nothing under
  # `branches: [main]`, so it reported no checks at all until the branch below
  # it merged. Unverified is worse than late. `push` stays on main so a branch
  # push does not duplicate the pull_request run.
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC

permissions: read-all

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true

      - name: Initialise CodeQL
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1

      - name: Analyse
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          category: "/language:go"
