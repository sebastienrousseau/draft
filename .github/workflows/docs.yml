name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"

      # Run codespell directly rather than through an action wrapper, so it
      # reads .codespellrc — the single place the ignore list and its reasons
      # live — and so `make docs-lint` locally is the same command CI runs.
      - name: Spell check
        run: |
          python3 -m pip install --quiet codespell
          codespell

      # Intra-repo links only, checked by a script in this repository rather
      # than a third-party action: it needs no network, it verifies heading
      # anchors as well as file paths, and `make docs-lint` runs exactly this.
      - name: Check intra-repo links
        run: python3 scripts/check-links.py

  # The manual is built on every pull request so it cannot rot between
  # releases, and published only from main. Its pages are the repository's own
  # Markdown, assembled by scripts/build-manual.py, so a chapter can never
  # disagree with the file it came from.
  manual:
    name: manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"
      - name: Build (warnings are errors)
        run: |
          python3 -m pip install --quiet mkdocs mkdocs-material
          python3 scripts/build-manual.py
          python3 -m mkdocs build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .gen/site

  # Publishing is separate and only runs on main. It is inert until GitHub
  # Pages is switched to the "GitHub Actions" source in repository settings,
  # which is deliberately left as a human decision: draftlib.com already
  # exists, and a second site should be a choice, not a side effect.
  publish:
    name: publish manual
    needs: manual
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
