version = 1

[[annotations]]
path = [
  "**.md",
  # devcontainer.json is JSON with comments, which reuse cannot parse for
  # tags; annotate it here rather than leave it uncovered.
  ".devcontainer/devcontainer.json",
  "go.mod",
  "go.sum",
  "Makefile",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".golangci.yml",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "internal/pdf/testdata/*.pdf",
  # Grounding-corpus fixtures. JSON admits no comment syntax, so the manifest
  # and the live baseline are annotated here rather than in-file.
  "claims/testdata/corpus/*.json",
  # Go fuzz corpus entries. Their format is fixed by the toolchain
  # ("go test fuzz v1" plus typed literals) and admits no comment syntax, so
  # they are annotated here rather than in-file.
  "**/testdata/fuzz/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau"
SPDX-License-Identifier = "MIT OR Apache-2.0"
