name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Non-merge commits introduced by this PR must be signed off. The DCO
          # (see /DCO, /CONTRIBUTING.md) certifies the contributor's right to
          # submit the change under the project's licence.
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing 'Signed-off-by'; run 'git commit -s' (see CONTRIBUTING.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits lack a DCO sign-off."
            exit 1
          fi
          echo "All commits are signed off."
